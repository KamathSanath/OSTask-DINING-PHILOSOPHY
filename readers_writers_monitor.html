<!DOCTYPE html><html><head><meta charset="utf-8"><title>Readers-Writers (Monitor)</title><style>
body{font-family:Segoe UI,Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:20px;text-align:center}
h1{margin:0}.sub{color:#94a3b8}
button{padding:8px 16px;margin:4px;border:0;border-radius:6px;font-weight:bold;cursor:pointer}
.card{display:inline-block;width:110px;padding:12px;margin:6px;border-radius:10px;color:#fff}
#res{margin:10px;font-size:17px}
#log{max-width:780px;margin:10px auto;height:200px;overflow:auto;background:#1e293b;border-radius:8px;text-align:left;padding:8px;font:12px Consolas,monospace}
input[type=range]{width:260px;vertical-align:middle}
</style></head><body>
<h1>Readers-Writers (Monitor)</h1><p class="sub">one lock + condition variable, writer preference</p>
<div id="view"></div><div id="res"></div>
<div><button id="b1" style="background:#22c55e">Start</button><button id="b2" style="background:#facc15">Pause</button><button id="b3" style="background:#fb7185">Reset</button>
Speed <input id="sp" type="range" min="1" max="10" value="3"></div>
<div>Timeline <input id="tl" type="range" min="0" max="0" value="0"></div>
<div id="log"></div>
<script>
const D={"kind": "rw", "actors": ["R1", "R2", "R3", "W1", "W2"], "initial": {"R1": "Idle", "R2": "Idle", "R3": "Idle", "W1": "Idle", "W2": "Idle"}, "initialForks": [], "events": [{"t": 0.014, "who": "R2", "state": "Waiting", "note": "enters monitor, checks start_read condition", "states": {"R1": "Idle", "R2": "Waiting", "R3": "Idle", "W1": "Idle", "W2": "Idle"}, "forks": []}, {"t": 0.014, "who": "R2", "state": "Reading", "note": "start_read granted (readers=1)", "states": {"R1": "Idle", "R2": "Reading", "R3": "Idle", "W1": "Idle", "W2": "Idle"}, "forks": []}, {"t": 0.161, "who": "W1", "state": "Waiting", "note": "enters monitor, checks start_write condition", "states": {"R1": "Idle", "R2": "Reading", "R3": "Idle", "W1": "Waiting", "W2": "Idle"}, "forks": []}, {"t": 0.314, "who": "R2", "state": "Idle", "note": "end_read (readers=0)", "states": {"R1": "Idle", "R2": "Idle", "R3": "Idle", "W1": "Waiting", "W2": "Idle"}, "forks": []}, {"t": 0.314, "who": "W1", "state": "Writing", "note": "start_write granted", "states": {"R1": "Idle", "R2": "Idle", "R3": "Idle", "W1": "Writing", "W2": "Idle"}, "forks": []}, {"t": 0.429, "who": "W2", "state": "Waiting", "note": "enters monitor, checks start_write condition", "states": {"R1": "Idle", "R2": "Idle", "R3": "Idle", "W1": "Writing", "W2": "Waiting"}, "forks": []}, {"t": 0.436, "who": "R3", "state": "Waiting", "note": "enters monitor, checks start_read condition", "states": {"R1": "Idle", "R2": "Idle", "R3": "Waiting", "W1": "Writing", "W2": "Waiting"}, "forks": []}, {"t": 0.533, "who": "R1", "state": "Waiting", "note": "enters monitor, checks start_read condition", "states": {"R1": "Waiting", "R2": "Idle", "R3": "Waiting", "W1": "Writing", "W2": "Waiting"}, "forks": []}, {"t": 0.626, "who": "R2", "state": "Waiting", "note": "enters monitor, checks start_read condition", "states": {"R1": "Waiting", "R2": "Waiting", "R3": "Waiting", "W1": "Writing", "W2": "Waiting"}, "forks": []}, {"t": 0.81, "who": "W1", "state": "Idle", "note": "wrote value 0 -> 1", "states": {"R1": "Waiting", "R2": "Waiting", "R3": "Waiting", "W1": "Idle", "W2": "Waiting"}, "forks": []}, {"t": 0.81, "who": "W2", "state": "Writing", "note": "start_write granted", "states": {"R1": "Waiting", "R2": "Waiting", "R3": "Waiting", "W1": "Idle", "W2": "Writing"}, "forks": []}, {"t": 1.211, "who": "W2", "state": "Idle", "note": "wrote value 1 -> 2", "states": {"R1": "Waiting", "R2": "Waiting", "R3": "Waiting", "W1": "Idle", "W2": "Idle"}, "forks": []}, {"t": 1.211, "who": "R3", "state": "Reading", "note": "start_read granted (readers=1)", "states": {"R1": "Waiting", "R2": "Waiting", "R3": "Reading", "W1": "Idle", "W2": "Idle"}, "forks": []}, {"t": 1.211, "who": "R2", "state": "Reading", "note": "start_read granted (readers=2)", "states": {"R1": "Waiting", "R2": "Reading", "R3": "Reading", "W1": "Idle", "W2": "Idle"}, "forks": []}, {"t": 1.211, "who": "R1", "state": "Reading", "note": "start_read granted (readers=3)", "states": {"R1": "Reading", "R2": "Reading", "R3": "Reading", "W1": "Idle", "W2": "Idle"}, "forks": []}, {"t": 1.226, "who": "W2", "state": "Waiting", "note": "enters monitor, checks start_write condition", "states": {"R1": "Reading", "R2": "Reading", "R3": "Reading", "W1": "Idle", "W2": "Waiting"}, "forks": []}, {"t": 1.301, "who": "W1", "state": "Waiting", "note": "enters monitor, checks start_write condition", "states": {"R1": "Reading", "R2": "Reading", "R3": "Reading", "W1": "Waiting", "W2": "Waiting"}, "forks": []}, {"t": 1.559, "who": "R2", "state": "Idle", "note": "end_read (readers=2)", "states": {"R1": "Reading", "R2": "Idle", "R3": "Reading", "W1": "Waiting", "W2": "Waiting"}, "forks": []}, {"t": 1.665, "who": "R3", "state": "Idle", "note": "end_read (readers=1)", "states": {"R1": "Reading", "R2": "Idle", "R3": "Idle", "W1": "Waiting", "W2": "Waiting"}, "forks": []}, {"t": 1.671, "who": "R3", "state": "Waiting", "note": "enters monitor, checks start_read condition", "states": {"R1": "Reading", "R2": "Idle", "R3": "Waiting", "W1": "Waiting", "W2": "Waiting"}, "forks": []}, {"t": 1.794, "who": "R1", "state": "Idle", "note": "end_read (readers=0)", "states": {"R1": "Idle", "R2": "Idle", "R3": "Waiting", "W1": "Waiting", "W2": "Waiting"}, "forks": []}, {"t": 1.794, "who": "W2", "state": "Writing", "note": "start_write granted", "states": {"R1": "Idle", "R2": "Idle", "R3": "Waiting", "W1": "Waiting", "W2": "Writing"}, "forks": []}, {"t": 1.879, "who": "R2", "state": "Waiting", "note": "enters monitor, checks start_read condition", "states": {"R1": "Idle", "R2": "Waiting", "R3": "Waiting", "W1": "Waiting", "W2": "Writing"}, "forks": []}, {"t": 2.183, "who": "W2", "state": "Idle", "note": "wrote value 2 -> 3", "states": {"R1": "Idle", "R2": "Waiting", "R3": "Waiting", "W1": "Waiting", "W2": "Idle"}, "forks": []}, {"t": 2.183, "who": "W1", "state": "Writing", "note": "start_write granted", "states": {"R1": "Idle", "R2": "Waiting", "R3": "Waiting", "W1": "Writing", "W2": "Idle"}, "forks": []}, {"t": 2.362, "who": "R1", "state": "Waiting", "note": "enters monitor, checks start_read condition", "states": {"R1": "Waiting", "R2": "Waiting", "R3": "Waiting", "W1": "Writing", "W2": "Idle"}, "forks": []}, {"t": 2.469, "who": "W2", "state": "Waiting", "note": "enters monitor, checks start_write condition", "states": {"R1": "Waiting", "R2": "Waiting", "R3": "Waiting", "W1": "Writing", "W2": "Waiting"}, "forks": []}, {"t": 2.607, "who": "W1", "state": "Idle", "note": "wrote value 3 -> 4", "states": {"R1": "Waiting", "R2": "Waiting", "R3": "Waiting", "W1": "Idle", "W2": "Waiting"}, "forks": []}, {"t": 2.607, "who": "W2", "state": "Writing", "note": "start_write granted", "states": {"R1": "Waiting", "R2": "Waiting", "R3": "Waiting", "W1": "Idle", "W2": "Writing"}, "forks": []}, {"t": 2.639, "who": "W1", "state": "Waiting", "note": "enters monitor, checks start_write condition", "states": {"R1": "Waiting", "R2": "Waiting", "R3": "Waiting", "W1": "Waiting", "W2": "Writing"}, "forks": []}, {"t": 3.04, "who": "W2", "state": "Idle", "note": "wrote value 4 -> 5", "states": {"R1": "Waiting", "R2": "Waiting", "R3": "Waiting", "W1": "Waiting", "W2": "Idle"}, "forks": []}, {"t": 3.04, "who": "W2", "state": "Finished", "note": "all rounds done", "states": {"R1": "Waiting", "R2": "Waiting", "R3": "Waiting", "W1": "Waiting", "W2": "Finished"}, "forks": []}, {"t": 3.04, "who": "W1", "state": "Writing", "note": "start_write granted", "states": {"R1": "Waiting", "R2": "Waiting", "R3": "Waiting", "W1": "Writing", "W2": "Finished"}, "forks": []}, {"t": 3.507, "who": "W1", "state": "Idle", "note": "wrote value 5 -> 6", "states": {"R1": "Waiting", "R2": "Waiting", "R3": "Waiting", "W1": "Idle", "W2": "Finished"}, "forks": []}, {"t": 3.507, "who": "W1", "state": "Finished", "note": "all rounds done", "states": {"R1": "Waiting", "R2": "Waiting", "R3": "Waiting", "W1": "Finished", "W2": "Finished"}, "forks": []}, {"t": 3.507, "who": "R3", "state": "Reading", "note": "start_read granted (readers=1)", "states": {"R1": "Waiting", "R2": "Waiting", "R3": "Reading", "W1": "Finished", "W2": "Finished"}, "forks": []}, {"t": 3.507, "who": "R2", "state": "Reading", "note": "start_read granted (readers=2)", "states": {"R1": "Waiting", "R2": "Reading", "R3": "Reading", "W1": "Finished", "W2": "Finished"}, "forks": []}, {"t": 3.507, "who": "R1", "state": "Reading", "note": "start_read granted (readers=3)", "states": {"R1": "Reading", "R2": "Reading", "R3": "Reading", "W1": "Finished", "W2": "Finished"}, "forks": []}, {"t": 3.892, "who": "R2", "state": "Idle", "note": "end_read (readers=2)", "states": {"R1": "Reading", "R2": "Idle", "R3": "Reading", "W1": "Finished", "W2": "Finished"}, "forks": []}, {"t": 3.892, "who": "R2", "state": "Finished", "note": "all rounds done", "states": {"R1": "Reading", "R2": "Finished", "R3": "Reading", "W1": "Finished", "W2": "Finished"}, "forks": []}, {"t": 3.947, "who": "R3", "state": "Idle", "note": "end_read (readers=1)", "states": {"R1": "Reading", "R2": "Finished", "R3": "Idle", "W1": "Finished", "W2": "Finished"}, "forks": []}, {"t": 4.068, "who": "R1", "state": "Idle", "note": "end_read (readers=0)", "states": {"R1": "Idle", "R2": "Finished", "R3": "Idle", "W1": "Finished", "W2": "Finished"}, "forks": []}, {"t": 4.162, "who": "R3", "state": "Waiting", "note": "enters monitor, checks start_read condition", "states": {"R1": "Idle", "R2": "Finished", "R3": "Waiting", "W1": "Finished", "W2": "Finished"}, "forks": []}, {"t": 4.163, "who": "R3", "state": "Reading", "note": "start_read granted (readers=1)", "states": {"R1": "Idle", "R2": "Finished", "R3": "Reading", "W1": "Finished", "W2": "Finished"}, "forks": []}, {"t": 4.308, "who": "R1", "state": "Waiting", "note": "enters monitor, checks start_read condition", "states": {"R1": "Waiting", "R2": "Finished", "R3": "Reading", "W1": "Finished", "W2": "Finished"}, "forks": []}, {"t": 4.308, "who": "R1", "state": "Reading", "note": "start_read granted (readers=2)", "states": {"R1": "Reading", "R2": "Finished", "R3": "Reading", "W1": "Finished", "W2": "Finished"}, "forks": []}, {"t": 4.517, "who": "R3", "state": "Idle", "note": "end_read (readers=1)", "states": {"R1": "Reading", "R2": "Finished", "R3": "Idle", "W1": "Finished", "W2": "Finished"}, "forks": []}, {"t": 4.517, "who": "R3", "state": "Finished", "note": "all rounds done", "states": {"R1": "Reading", "R2": "Finished", "R3": "Finished", "W1": "Finished", "W2": "Finished"}, "forks": []}, {"t": 4.838, "who": "R1", "state": "Idle", "note": "end_read (readers=0)", "states": {"R1": "Idle", "R2": "Finished", "R3": "Finished", "W1": "Finished", "W2": "Finished"}, "forks": []}, {"t": 4.838, "who": "R1", "state": "Finished", "note": "all rounds done", "states": {"R1": "Finished", "R2": "Finished", "R3": "Finished", "W1": "Finished", "W2": "Finished"}, "forks": []}]},E=D.events,N=E.length,$=id=>document.getElementById(id);
const C={Idle:'#475569',Thinking:'#475569',Waiting:'#d97706',Hungry:'#d97706','Acquiring Forks':'#0284c7',Eating:'#16a34a',Reading:'#16a34a','Releasing Forks':'#7c3aed',Writing:'#dc2626',Finished:'#1e293b'};
let i=0,timer=null;
function drawRW(s){
  $('view').innerHTML=D.actors.map(a=>`<div class="card" style="background:${C[s[a]]}"><b>${a}</b><br>${s[a]}</div>`).join('');
  const rd=D.actors.filter(a=>s[a]==='Reading'),wr=D.actors.filter(a=>s[a]==='Writing'),wa=D.actors.filter(a=>s[a]==='Waiting');
  $('res').innerHTML='Shared resource: <b>'+(wr.length?'WRITE-LOCKED by '+wr[0]:rd.length?'READ by '+rd.join(', '):'FREE')+'</b> &nbsp; Waiting: '+(wa.join(', ')||'none');
}
function drawDP(s,f){
  let h='<svg viewBox="0 0 420 420" width="420"><circle cx="210" cy="210" r="95" fill="#1e293b"/>';
  D.actors.forEach((a,k)=>{const g=(-90+90*k)*Math.PI/180,x=210+150*Math.cos(g),y=210+150*Math.sin(g);
    h+=`<circle cx="${x}" cy="${y}" r="40" fill="${C[s[a]]}"/><text x="${x}" y="${y-2}" text-anchor="middle" fill="#fff" font-weight="bold">${a}</text><text x="${x}" y="${y+13}" text-anchor="middle" fill="#fff" font-size="10">${s[a]}</text>`;});
  f.forEach((o,k)=>{const g=(-90+90*k+45)*Math.PI/180,x=210+105*Math.cos(g),y=210+105*Math.sin(g);
    h+=`<rect x="${x-14}" y="${y-14}" width="28" height="28" rx="6" fill="${o?'#f97316':'#334155'}"/><text x="${x}" y="${y+4}" text-anchor="middle" fill="#fff" font-size="11">F${k+1}</text><text x="${x}" y="${y+27}" text-anchor="middle" fill="#cbd5e1" font-size="9">${o||'free'}</text>`;});
  $('view').innerHTML=h+'</svg>';
  const m={};D.actors.forEach(a=>m[a]=0);E.slice(0,i).forEach(e=>{if(e.state==='Eating')m[e.who]++;});
  $('res').innerHTML='Forks in use: '+f.filter(x=>x).length+'/'+f.length+' &nbsp; Meals: '+D.actors.map(a=>a+'='+m[a]).join(', ');
}
function render(){
  const s=i?E[i-1].states:D.initial,f=i?E[i-1].forks:D.initialForks;
  $('tl').max=N;$('tl').value=i;
  D.kind==='dp'?drawDP(s,f):drawRW(s);
  $('log').innerHTML=E.slice(0,i).map(e=>'['+e.t.toFixed(2)+'s] '+e.who+' -> '+e.state+': '+e.note).reverse().join('<br>');
}
function stop(){clearInterval(timer);timer=null;}
function step(){if(i<N){i++;render();}else stop();}
function play(){stop();if(i>=N)i=0;timer=setInterval(step,1100/$('sp').value);}
$('b1').onclick=play;$('b2').onclick=stop;
$('b3').onclick=()=>{stop();i=0;render();};
$('sp').oninput=()=>{if(timer)play();};
$('tl').oninput=()=>{stop();i=+$('tl').value;render();};
render();
</script></body></html>
